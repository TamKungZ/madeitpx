name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Dry run: tag to build and verify (vX.Y.Z). Nothing is released or published."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $RELEASE_TAG is not strict semver (vX.Y.Z)"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag commit is not on main"
              exit 1
            fi
          else
            echo "::notice::Dry run for $RELEASE_TAG on $GITHUB_REF_NAME ($GITHUB_SHA); nothing will be released"
          fi

  prepare-notes:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## \[{re.escape(version)}\](?: .*)?$", re.MULTILINE)
          match = heading.search(changelog)
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")

          section_start = match.end()
          next_section = re.search(r"^## ", changelog[section_start:], re.MULTILINE)
          section_end = section_start + next_section.start() if next_section else len(changelog)
          notes = changelog[section_start:section_end].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty")

          output = Path("release-notes")
          output.mkdir(exist_ok=True)
          (output / "release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes/
          if-no-files-found: error
          retention-days: 7

  build-native:
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: windows-x64
            target: x86_64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: windows-11-arm
            rid: windows-arm64
            target: aarch64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: ubuntu-24.04
            rid: linux-x64-gnu
            target: x86_64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: ubuntu-24.04-arm
            rid: linux-arm64-gnu
            target: aarch64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: macos-15-intel
            rid: darwin-x64
            target: x86_64-macos
            library: zig-out/lib/libmadeitpx.dylib
          - runner: macos-15
            rid: darwin-arm64
            target: aarch64-macos
            library: zig-out/lib/libmadeitpx.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build native library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RID: ${{ matrix.rid }}
          LIBRARY: ${{ matrix.library }}
        run: |
          zig build test
          zig build test -Doptimize=ReleaseFast -Dtarget="$TARGET"
          zig build -Doptimize=ReleaseFast -Dtarget="$TARGET"
          if [ ! -f "$LIBRARY" ]; then
            echo "::error::Expected library not found: $LIBRARY"
            exit 1
          fi
          mkdir -p "native/$RID"
          cp "$LIBRARY" "native/$RID/"
      - uses: actions/upload-artifact@v4
        with:
          name: madeitpx-native-${{ matrix.rid }}
          path: native/
          if-no-files-found: error
          retention-days: 7

  verify-packages:
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Verify Node.js packages
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for mapping in \
            "windows-x64:win32-x64:madeitpx.dll" \
            "windows-arm64:win32-arm64:madeitpx.dll" \
            "linux-x64-gnu:linux-x64-gnu:libmadeitpx.so" \
            "linux-arm64-gnu:linux-arm64-gnu:libmadeitpx.so" \
            "darwin-x64:darwin-x64:libmadeitpx.dylib" \
            "darwin-arm64:darwin-arm64:libmadeitpx.dylib"; do
            IFS=: read -r rid package library <<< "$mapping"
            package_dir="bindings/node/platforms/$package"
            if [ ! -f "native-assets/$rid/$library" ]; then
              echo "::error::Missing native-assets/$rid/$library"
              exit 1
            fi
            cp "native-assets/$rid/$library" "$package_dir/"
            cp LICENSE "$package_dir/LICENSE"
            node -e "const fs=require('node:fs'); const p=process.argv[1]; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.version=process.argv[2]; fs.writeFileSync(p, JSON.stringify(m, null, 2)+'\n');" "$package_dir/package.json" "$version"
            output=$(npm pack --dry-run "$package_dir" 2>&1)
            if ! grep -qF "$library" <<< "$output"; then
              echo "::error::npm package $package does not contain $library"
              echo "$output"
              exit 1
            fi
          done
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          const file = 'bindings/node/package.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const platformsDir = 'bindings/node/platforms';
          const names = fs.readdirSync(platformsDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => JSON.parse(fs.readFileSync(path.join(platformsDir, entry.name, 'package.json'), 'utf8')).name)
            .sort();
          const optional = Object.keys(manifest.optionalDependencies || {}).sort();
          if (names.length !== 6) {
            throw new Error(`Expected 6 platform packages, found ${names.length}`);
          }
          if (JSON.stringify(names) !== JSON.stringify(optional)) {
            throw new Error(`optionalDependencies ${optional} do not match platform packages ${names}`);
          }
          manifest.version = version;
          for (const name of optional) {
            manifest.optionalDependencies[name] = version;
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          JS
          npm pack --dry-run bindings/node
      - name: Verify NuGet package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          project="bindings/dotnet/src/MadeIt.PixelArt"
          for mapping in \
            "windows-x64:win-x64:madeitpx.dll" \
            "windows-arm64:win-arm64:madeitpx.dll" \
            "linux-x64-gnu:linux-x64:libmadeitpx.so" \
            "linux-arm64-gnu:linux-arm64:libmadeitpx.so" \
            "darwin-x64:osx-x64:libmadeitpx.dylib" \
            "darwin-arm64:osx-arm64:libmadeitpx.dylib"; do
            IFS=: read -r source rid library <<< "$mapping"
            destination="$project/runtimes/$rid/native"
            mkdir -p "$destination"
            cp "native-assets/$source/$library" "$destination/"
          done
          version="${RELEASE_TAG#v}"
          dotnet pack "$project/MadeIt.PixelArt.csproj" \
            --configuration Release \
            --output artifacts \
            -p:PackageVersion="$version"
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg, found ${#packages[@]}"
            exit 1
          fi
          listing=$(unzip -l "${packages[0]}")
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            if ! grep -q "runtimes/$rid/native/" <<< "$listing"; then
              echo "::error::NuGet package is missing native library for $rid"
              exit 1
            fi
          done
      - name: Verify Python distributions
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            destination="bindings/python/src/madeitpx/native/$rid"
            mkdir -p "$destination"
            cp "native-assets/$rid/"* "$destination/"
          done
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" bindings/python/src/madeitpx/__init__.py
          if ! grep -q "^__version__ = \"$version\"$" bindings/python/src/madeitpx/__init__.py; then
            echo "::error::__version__ was not updated"
            exit 1
          fi
          python -m pip install build twine
          python -m build bindings/python --outdir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one Python wheel, found {len(wheels)}")
          expected = {
              "madeitpx/native/windows-x64/madeitpx.dll",
              "madeitpx/native/windows-arm64/madeitpx.dll",
              "madeitpx/native/linux-x64-gnu/libmadeitpx.so",
              "madeitpx/native/linux-arm64-gnu/libmadeitpx.so",
              "madeitpx/native/darwin-x64/libmadeitpx.dylib",
              "madeitpx/native/darwin-arm64/libmadeitpx.dylib",
          }
          with ZipFile(wheels[0]) as archive:
              missing = expected.difference(archive.namelist())
          if missing:
              raise SystemExit(f"Wheel is missing native libraries: {sorted(missing)}")
          PY
          twine check dist/*
          python -m pip install dist/*.whl
          python -c "import sys, madeitpx; assert madeitpx.__version__ == sys.argv[1], madeitpx.__version__" "$version"
      - name: Verify Rust crate
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            mkdir -p "bindings/rust/native/$rid"
            cp "native-assets/$rid/"* "bindings/rust/native/$rid/"
          done
          version="${RELEASE_TAG#v}"
          sed -i '0,/^version = .*/s//version = "'"$version"'"/' bindings/rust/Cargo.toml
          if ! grep -q "^version = \"$version\"$" bindings/rust/Cargo.toml; then
            echo "::error::Cargo.toml version was not updated"
            exit 1
          fi
          cargo update --manifest-path bindings/rust/Cargo.toml --workspace
          listing=$(cargo package --manifest-path bindings/rust/Cargo.toml --allow-dirty --list)
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            if ! grep -q "native/$rid/" <<< "$listing"; then
              echo "::error::Crate is missing native library for $rid"
              exit 1
            fi
          done
          cargo package --manifest-path bindings/rust/Cargo.toml --allow-dirty \
            --target-dir "$RUNNER_TEMP/cargo-package"
          crate=$(ls "$RUNNER_TEMP"/cargo-package/package/*.crate)
          size=$(stat -c %s "$crate")
          if [ "$size" -gt 10485760 ]; then
            echo "::error::Crate is $size bytes, above the crates.io 10 MiB limit"
            exit 1
          fi
      - name: Verify Java artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for mapping in \
            "windows-x64:madeitpx.dll" \
            "windows-arm64:madeitpx.dll" \
            "linux-x64-gnu:libmadeitpx.so" \
            "linux-arm64-gnu:libmadeitpx.so" \
            "darwin-x64:libmadeitpx.dylib" \
            "darwin-arm64:libmadeitpx.dylib"; do
            IFS=: read -r rid library <<< "$mapping"
            destination="bindings/java/src/main/resources/native/$rid"
            mkdir -p "$destination"
            cp "native-assets/$rid/$library" "$destination/"
          done
          version="${RELEASE_TAG#v}"
          mvn --batch-mode --file bindings/java/pom.xml versions:set \
            -DnewVersion="$version" \
            -DgenerateBackupPoms=false
          mvn --batch-mode --file bindings/java/pom.xml package -Dgpg.skip=true
          jar="bindings/java/target/madeitpx-$version.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::$jar not found"
            ls -la bindings/java/target
            exit 1
          fi
          listing=$(unzip -l "$jar")
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            if ! grep -q "native/$rid/" <<< "$listing"; then
              echo "::error::JAR is missing native library for $rid"
              exit 1
            fi
          done

  approve:
    if: github.event_name == 'push'
    needs: [prepare-notes, build-native, verify-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: release
    steps:
      - run: echo "Release ${{ inputs.tag || github.ref_name }} approved"

  create-release:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "madeitpx $RELEASE_TAG" \
              --notes-file release-notes/release-notes.md
          fi

  attach-native:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Create native release archives
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          native = Path("native-assets")
          output = Path("release-assets")
          output.mkdir()
          for platform_dir in sorted(native.iterdir()):
              if not platform_dir.is_dir():
                  continue
              files = list(platform_dir.iterdir())
              if len(files) != 1 or not files[0].is_file():
                  raise SystemExit(f"Unexpected native files in {platform_dir}")
              archive = output / f"madeitpx-{platform_dir.name}.zip"
              with ZipFile(archive, "w", ZIP_DEFLATED) as bundle:
                  bundle.write(files[0], files[0].name)
                  bundle.write("include/madeitpx.h", "madeitpx.h")
                  bundle.write("LICENSE", "LICENSE")
          if len(list(output.glob("*.zip"))) != 6:
              raise SystemExit("Expected native archives for all six supported targets")
          PY
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
      - name: Attach native archives to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  publish-node-platforms:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: windows-x64
            package: win32-x64
          - rid: windows-arm64
            package: win32-arm64
          - rid: linux-x64-gnu
            package: linux-x64-gnu
          - rid: linux-arm64-gnu
            package: linux-arm64-gnu
          - rid: darwin-x64
            package: darwin-x64
          - rid: darwin-arm64
            package: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          scope: "@madeit"
      - name: Check npm version
        run: |
          required=11.5.1
          current=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $current is older than $required (required for trusted publishing)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: madeitpx-native-${{ matrix.rid }}
          path: native-assets
      - name: Publish platform package
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          PACKAGE: ${{ matrix.package }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package_dir="bindings/node/platforms/$PACKAGE"
          library=$(find "native-assets/$RID" -maxdepth 1 -type f -print -quit)
          test -n "$library"
          cp "$library" "$package_dir/"
          cp LICENSE "$package_dir/LICENSE"
          version="${RELEASE_TAG#v}"
          node -e "const fs=require('node:fs'); const p=process.argv[1]; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.version=process.argv[2]; fs.writeFileSync(p, JSON.stringify(m, null, 2)+'\n');" "$package_dir/package.json" "$version"
          name=$(node -p "require('./$package_dir/package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish "$package_dir" --access public
          fi

  publish-node:
    needs: publish-node-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          scope: "@madeit"
      - name: Check npm version
        run: |
          required=11.5.1
          current=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $current is older than $required (required for trusted publishing)"
            exit 1
          fi
      - name: Publish Node.js package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const file = 'bindings/node/package.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          manifest.version = version;
          for (const name of Object.keys(manifest.optionalDependencies)) {
            manifest.optionalDependencies[name] = version;
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          JS
          version="${RELEASE_TAG#v}"
          name=$(node -p "require('./bindings/node/package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish bindings/node --access public
          fi

  publish-dotnet:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Pack NuGet package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          project="bindings/dotnet/src/MadeIt.PixelArt"
          for mapping in \
            "windows-x64:win-x64:madeitpx.dll" \
            "windows-arm64:win-arm64:madeitpx.dll" \
            "linux-x64-gnu:linux-x64:libmadeitpx.so" \
            "linux-arm64-gnu:linux-arm64:libmadeitpx.so" \
            "darwin-x64:osx-x64:libmadeitpx.dylib" \
            "darwin-arm64:osx-arm64:libmadeitpx.dylib"; do
            IFS=: read -r source rid library <<< "$mapping"
            destination="$project/runtimes/$rid/native"
            mkdir -p "$destination"
            cp "native-assets/$source/$library" "$destination/"
          done
          version="${RELEASE_TAG#v}"
          dotnet pack "$project/MadeIt.PixelArt.csproj" \
            --configuration Release \
            --output artifacts \
            -p:PackageVersion="$version"
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg, found ${#packages[@]}"
            exit 1
          fi
          listing=$(unzip -l "${packages[0]}")
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            if ! grep -q "runtimes/$rid/native/" <<< "$listing"; then
              echo "::error::NuGet package is missing native library for $rid"
              exit 1
            fi
          done
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: TamKungZ
      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
      - name: Attach NuGet package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.nupkg --clobber

  publish-python:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/madeitpx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Build Python distributions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            destination="bindings/python/src/madeitpx/native/$rid"
            mkdir -p "$destination"
            cp "native-assets/$rid/"* "$destination/"
          done
          version="${RELEASE_TAG#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" bindings/python/src/madeitpx/__init__.py
          if ! grep -q "^__version__ = \"$version\"$" bindings/python/src/madeitpx/__init__.py; then
            echo "::error::__version__ was not updated"
            exit 1
          fi
          python -m pip install build
          python -m build bindings/python --outdir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one Python wheel, found {len(wheels)}")
          expected = {
              "madeitpx/native/windows-x64/madeitpx.dll",
              "madeitpx/native/windows-arm64/madeitpx.dll",
              "madeitpx/native/linux-x64-gnu/libmadeitpx.so",
              "madeitpx/native/linux-arm64-gnu/libmadeitpx.so",
              "madeitpx/native/darwin-x64/libmadeitpx.dylib",
              "madeitpx/native/darwin-arm64/libmadeitpx.dylib",
          }
          with ZipFile(wheels[0]) as archive:
              missing = expected.difference(archive.namelist())
          if missing:
              raise SystemExit(f"Wheel is missing native libraries: {sorted(missing)}")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Attach Python distributions to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  publish-rust:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            mkdir -p "bindings/rust/native/$rid"
            cp "native-assets/$rid/"* "bindings/rust/native/$rid/"
          done
          version="${RELEASE_TAG#v}"
          sed -i '0,/^version = .*/s//version = "'"$version"'"/' bindings/rust/Cargo.toml
          if ! grep -q "^version = \"$version\"$" bindings/rust/Cargo.toml; then
            echo "::error::Cargo.toml version was not updated"
            exit 1
          fi
          cargo update --manifest-path bindings/rust/Cargo.toml --workspace
          cargo publish --manifest-path bindings/rust/Cargo.toml --allow-dirty

  publish-java:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Build Java artifact
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          for mapping in \
            "windows-x64:madeitpx.dll" \
            "windows-arm64:madeitpx.dll" \
            "linux-x64-gnu:libmadeitpx.so" \
            "linux-arm64-gnu:libmadeitpx.so" \
            "darwin-x64:libmadeitpx.dylib" \
            "darwin-arm64:libmadeitpx.dylib"; do
            IFS=: read -r rid library <<< "$mapping"
            destination="bindings/java/src/main/resources/native/$rid"
            mkdir -p "$destination"
            cp "native-assets/$rid/$library" "$destination/"
          done
          version="${RELEASE_TAG#v}"
          mvn --batch-mode --file bindings/java/pom.xml versions:set \
            -DnewVersion="$version" \
            -DgenerateBackupPoms=false
          mvn --batch-mode --file bindings/java/pom.xml package
          jar="bindings/java/target/madeitpx-$version.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::$jar not found"
            ls -la bindings/java/target
            exit 1
          fi
      - name: Attach Java JAR to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "bindings/java/target/madeitpx-${RELEASE_TAG#v}.jar" --clobber
      - name: Deploy Java artifact to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode --file bindings/java/pom.xml deploy -DskipTests

  summary:
    if: always()
    needs:
      - validate-tag
      - prepare-notes
      - build-native
      - verify-packages
      - approve
      - create-release
      - attach-native
      - publish-node-platforms
      - publish-node
      - publish-dotnet
      - publish-python
      - publish-rust
      - publish-java
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write job summary
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS"])
          lines = [
              f"## Release {os.environ['RELEASE_TAG']}"
              + (" (dry run)" if os.environ["EVENT_NAME"] == "workflow_dispatch" else ""),
              "",
              "| Job | Result |",
              "| --- | --- |",
          ]
          for name, data in needs.items():
              lines.append(f"| {name} | {data['result']} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY