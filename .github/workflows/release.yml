name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## \[{re.escape(version)}\](?: .*)?$", re.MULTILINE)
          match = heading.search(changelog)
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")

          section_start = match.end()
          next_section = re.search(r"^## ", changelog[section_start:], re.MULTILINE)
          section_end = section_start + next_section.start() if next_section else len(changelog)
          notes = changelog[section_start:section_end].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty")

          notes_path = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          notes_path.write_text(notes + "\n", encoding="utf-8")
          print(f"Prepared release notes for {tag}")
          PY
          gh release create "$RELEASE_TAG" \
            --title "madeitpx $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  publish-node-platforms:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            package: win32-x64
            target: x86_64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: windows-11-arm
            package: win32-arm64
            target: aarch64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: ubuntu-24.04
            package: linux-x64-gnu
            target: x86_64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: ubuntu-24.04-arm
            package: linux-arm64-gnu
            target: aarch64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: macos-15-intel
            package: darwin-x64
            target: x86_64-macos
            library: zig-out/lib/libmadeitpx.dylib
          - runner: macos-15
            package: darwin-arm64
            target: aarch64-macos
            library: zig-out/lib/libmadeitpx.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          scope: "@madeit"
      - name: Build and publish platform package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          LIBRARY: ${{ matrix.library }}
          VERSION: ${{ github.ref_name }}
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget="$TARGET"
          package_dir="bindings/node/platforms/$PACKAGE"
          cp "$LIBRARY" "$package_dir/"
          cp LICENSE "$package_dir/LICENSE"
          version="${VERSION#v}"
          node -e "const fs=require('node:fs'); const p='$package_dir/package.json'; const m=JSON.parse(fs.readFileSync(p)); m.version='$version'; fs.writeFileSync(p, JSON.stringify(m, null, 2)+'\n');"
          npm publish "$package_dir" --access public

  publish-node:
    needs: publish-node-platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          scope: "@madeit"
      - name: Publish Node.js package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const file = 'bindings/node/package.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const version = process.env.VERSION.replace(/^v/, '');
          manifest.version = version;
          for (const name of Object.keys(manifest.optionalDependencies)) {
            manifest.optionalDependencies[name] = version;
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          JS
          npm publish bindings/node --access public

  package-java:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build native libraries and package Java artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          mvn --batch-mode --file bindings/java/pom.xml versions:set \
            -DnewVersion="$version" \
            -DgenerateBackupPoms=false
          while IFS=' ' read -r target platform library; do
            zig build -Doptimize=ReleaseFast -Dtarget="$target"
            destination="bindings/java/src/main/resources/native/$platform"
            mkdir -p "$destination"
            cp "$library" "$destination/"
          done <<'TARGETS'
          x86_64-windows windows-x64 zig-out/bin/madeitpx.dll
          aarch64-windows windows-arm64 zig-out/bin/madeitpx.dll
          x86_64-linux-gnu.2.17 linux-x64-gnu zig-out/lib/libmadeitpx.so
          aarch64-linux-gnu.2.17 linux-arm64-gnu zig-out/lib/libmadeitpx.so
          x86_64-macos darwin-x64 zig-out/lib/libmadeitpx.dylib
          aarch64-macos darwin-arm64 zig-out/lib/libmadeitpx.dylib
          TARGETS
          mvn --batch-mode --file bindings/java/pom.xml package
      - name: Attach Java package to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "bindings/java/target/madeitpx-${RELEASE_TAG#v}.jar" --clobber

  build-dotnet-native:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            target: x86_64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: windows-11-arm
            rid: win-arm64
            target: aarch64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: ubuntu-24.04
            rid: linux-x64
            target: x86_64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            target: aarch64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: macos-15-intel
            rid: osx-x64
            target: x86_64-macos
            library: zig-out/lib/libmadeitpx.dylib
          - runner: macos-15
            rid: osx-arm64
            target: aarch64-macos
            library: zig-out/lib/libmadeitpx.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build native library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LIBRARY: ${{ matrix.library }}
          RID: ${{ matrix.rid }}
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget="$TARGET"
          destination="dotnet-native/runtimes/$RID/native"
          mkdir -p "$destination"
          cp "$LIBRARY" "$destination/"
      - uses: actions/upload-artifact@v4
        with:
          name: madeitpx-${{ matrix.rid }}
          path: dotnet-native/
          if-no-files-found: error
          retention-days: 1

  package-dotnet:
    needs: [publish, build-dotnet-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-*
          path: bindings/dotnet/src/MadeIt.PixelArt
          merge-multiple: true
      - name: Pack NuGet package with native assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          dotnet pack bindings/dotnet/src/MadeIt.PixelArt/MadeIt.PixelArt.csproj \
            --configuration Release \
            --output artifacts \
            -p:PackageVersion="$version"
      - name: Attach NuGet package to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "artifacts/MadeIt.PixelArt-${RELEASE_TAG#v}.nupkg" --clobber

  build-python-native:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: windows-x64
            target: x86_64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: windows-11-arm
            rid: windows-arm64
            target: aarch64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: ubuntu-24.04
            rid: linux-x64-gnu
            target: x86_64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: ubuntu-24.04-arm
            rid: linux-arm64-gnu
            target: aarch64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: macos-15-intel
            rid: darwin-x64
            target: x86_64-macos
            library: zig-out/lib/libmadeitpx.dylib
          - runner: macos-15
            rid: darwin-arm64
            target: aarch64-macos
            library: zig-out/lib/libmadeitpx.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build native library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LIBRARY: ${{ matrix.library }}
          RID: ${{ matrix.rid }}
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget="$TARGET"
          destination="python-native/native/$RID"
          mkdir -p "$destination"
          cp "$LIBRARY" "$destination/"
      - uses: actions/upload-artifact@v4
        with:
          name: madeitpx-python-${{ matrix.rid }}
          path: python-native/
          if-no-files-found: error
          retention-days: 1

  publish-python:
    needs: [publish, build-python-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/madeitpx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-python-*
          path: bindings/python/src/madeitpx
          merge-multiple: true
      - name: Build wheel and source distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" bindings/python/src/madeitpx/__init__.py
          python -m pip install build
          python -m build bindings/python --outdir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          expected = {
              "madeitpx/native/windows-x64/madeitpx.dll",
              "madeitpx/native/windows-arm64/madeitpx.dll",
              "madeitpx/native/linux-x64-gnu/libmadeitpx.so",
              "madeitpx/native/linux-arm64-gnu/libmadeitpx.so",
              "madeitpx/native/darwin-x64/libmadeitpx.dylib",
              "madeitpx/native/darwin-arm64/libmadeitpx.dylib",
          }
          with ZipFile(wheel) as archive:
              missing = expected.difference(archive.namelist())
          if missing:
              raise SystemExit(f"Wheel is missing native libraries: {sorted(missing)}")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach Python distributions to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  build-rust-native:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: windows-x64
            target: x86_64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: windows-11-arm
            rid: windows-arm64
            target: aarch64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: ubuntu-24.04
            rid: linux-x64-gnu
            target: x86_64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: ubuntu-24.04-arm
            rid: linux-arm64-gnu
            target: aarch64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: macos-15-intel
            rid: darwin-x64
            target: x86_64-macos
            library: zig-out/lib/libmadeitpx.dylib
          - runner: macos-15
            rid: darwin-arm64
            target: aarch64-macos
            library: zig-out/lib/libmadeitpx.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build native library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LIBRARY: ${{ matrix.library }}
          RID: ${{ matrix.rid }}
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget="$TARGET"
          destination="rust-native/native/$RID"
          mkdir -p "$destination"
          cp "$LIBRARY" "$destination/"
      - uses: actions/upload-artifact@v4
        with:
          name: madeitpx-rust-${{ matrix.rid }}
          path: rust-native/
          if-no-files-found: error
          retention-days: 1

  publish-rust:
    needs: [publish, build-rust-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-rust-*
          path: bindings/rust
          merge-multiple: true
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          sed -i "s/^version = .*/version = \"$version\"/" bindings/rust/Cargo.toml
          cargo update --manifest-path bindings/rust/Cargo.toml --workspace
          cargo publish --manifest-path bindings/rust/Cargo.toml
