name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (vX.Y.Z). With publish off: dry run on the selected branch, nothing is released. With publish on: re-run the real release for this existing tag."
        required: true
        type: string
      publish:
        description: "Publish for real: re-run the release for an EXISTING tag (run this workflow from main; the tag's source is built, this workflow file is used)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_REF: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) && format('refs/tags/{0}', inputs.tag) || github.sha }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $RELEASE_TAG is not strict semver (vX.Y.Z)"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$PUBLISH" = "true" ]; then
            if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Publishing manually must be dispatched from main (got $GITHUB_REF)"
              exit 1
            fi
            git fetch --tags --force origin
            git fetch origin main
            if ! tag_sha=$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}"); then
              echo "::error::Tag $RELEASE_TAG does not exist in the repository"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
              echo "::error::Tag commit is not on main"
              exit 1
            fi
            echo "::notice::Releasing $RELEASE_TAG from $tag_sha (event: $GITHUB_EVENT_NAME)"
          else
            echo "::notice::Dry run for $RELEASE_TAG on $GITHUB_REF_NAME ($GITHUB_SHA); nothing will be released"
          fi

  prepare-notes:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## \[{re.escape(version)}\](?: .*)?$", re.MULTILINE)
          match = heading.search(changelog)
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")

          section_start = match.end()
          next_section = re.search(r"^## ", changelog[section_start:], re.MULTILINE)
          section_end = section_start + next_section.start() if next_section else len(changelog)
          notes = changelog[section_start:section_end].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty")

          output = Path("release-notes")
          output.mkdir(exist_ok=True)
          (output / "release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes/
          if-no-files-found: error
          retention-days: 7

  build-native:
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: windows-x64
            target: x86_64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: windows-11-arm
            rid: windows-arm64
            target: aarch64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: ubuntu-24.04
            rid: linux-x64-gnu
            target: x86_64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: ubuntu-24.04-arm
            rid: linux-arm64-gnu
            target: aarch64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: macos-15-intel
            rid: darwin-x64
            target: x86_64-macos
            library: zig-out/lib/libmadeitpx.dylib
          - runner: macos-15
            rid: darwin-arm64
            target: aarch64-macos
            library: zig-out/lib/libmadeitpx.dylib
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build native library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RID: ${{ matrix.rid }}
          LIBRARY: ${{ matrix.library }}
        run: |
          zig build test
          zig build test -Doptimize=ReleaseFast -Dtarget="$TARGET"
          zig build -Doptimize=ReleaseFast -Dtarget="$TARGET"
          if [ ! -f "$LIBRARY" ]; then
            echo "::error::Expected library not found: $LIBRARY"
            exit 1
          fi
          mkdir -p "native/$RID"
          cp "$LIBRARY" "native/$RID/"
      - uses: actions/upload-artifact@v4
        with:
          name: madeitpx-native-${{ matrix.rid }}
          path: native/
          if-no-files-found: error
          retention-days: 7

  verify-packages:
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Verify Node.js packages
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for mapping in \
            "windows-x64:win32-x64:madeitpx.dll" \
            "windows-arm64:win32-arm64:madeitpx.dll" \
            "linux-x64-gnu:linux-x64-gnu:libmadeitpx.so" \
            "linux-arm64-gnu:linux-arm64-gnu:libmadeitpx.so" \
            "darwin-x64:darwin-x64:libmadeitpx.dylib" \
            "darwin-arm64:darwin-arm64:libmadeitpx.dylib"; do
            IFS=: read -r rid package library <<< "$mapping"
            package_dir="bindings/node/platforms/$package"
            if [ ! -f "native-assets/$rid/$library" ]; then
              echo "::error::Missing native-assets/$rid/$library"
              exit 1
            fi
            cp "native-assets/$rid/$library" "$package_dir/"
            cp LICENSE "$package_dir/LICENSE"
            node -e "const fs=require('node:fs'); const p=process.argv[1]; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.version=process.argv[2]; fs.writeFileSync(p, JSON.stringify(m, null, 2)+'\n');" "$package_dir/package.json" "$version"
            output=$(npm pack --dry-run "./$package_dir" 2>&1)
            if ! grep -qF "$library" <<< "$output"; then
              echo "::error::npm package $package does not contain $library"
              echo "$output"
              exit 1
            fi
          done
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          const file = 'bindings/node/package.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const platformsDir = 'bindings/node/platforms';
          const names = fs.readdirSync(platformsDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => JSON.parse(fs.readFileSync(path.join(platformsDir, entry.name, 'package.json'), 'utf8')).name)
            .sort();
          const optional = Object.keys(manifest.optionalDependencies || {}).sort();
          if (names.length !== 6) {
            throw new Error(`Expected 6 platform packages, found ${names.length}`);
          }
          if (JSON.stringify(names) !== JSON.stringify(optional)) {
            throw new Error(`optionalDependencies ${optional} do not match platform packages ${names}`);
          }
          manifest.version = version;
          for (const name of optional) {
            manifest.optionalDependencies[name] = version;
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          JS
          npm pack --dry-run ./bindings/node
      - name: Verify NuGet package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          project="bindings/dotnet/src/MadeIt.PixelArt"
          for mapping in \
            "windows-x64:win-x64:madeitpx.dll" \
            "windows-arm64:win-arm64:madeitpx.dll" \
            "linux-x64-gnu:linux-x64:libmadeitpx.so" \
            "linux-arm64-gnu:linux-arm64:libmadeitpx.so" \
            "darwin-x64:osx-x64:libmadeitpx.dylib" \
            "darwin-arm64:osx-arm64:libmadeitpx.dylib"; do
            IFS=: read -r source rid library <<< "$mapping"
            destination="$project/runtimes/$rid/native"
            mkdir -p "$destination"
            cp "native-assets/$source/$library" "$destination/"
          done
          version="${RELEASE_TAG#v}"
          dotnet pack "$project/MadeIt.PixelArt.csproj" \
            --configuration Release \
            --output artifacts \
            -p:PackageVersion="$version"
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg, found ${#packages[@]}"
            exit 1
          fi
          listing=$(unzip -l "${packages[0]}")
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            if ! grep -q "runtimes/$rid/native/" <<< "$listing"; then
              echo "::error::NuGet package is missing native library for $rid"
              exit 1
            fi
          done
      - name: Verify Python distributions
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            destination="bindings/python/src/madeitpx/native/$rid"
            mkdir -p "$destination"
            cp "native-assets/$rid/"* "$destination/"
          done
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" bindings/python/src/madeitpx/__init__.py
          if ! grep -q "^__version__ = \"$version\"$" bindings/python/src/madeitpx/__init__.py; then
            echo "::error::__version__ was not updated"
            exit 1
          fi
          python -m pip install build twine
          python -m build bindings/python --outdir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one Python wheel, found {len(wheels)}")
          expected = {
              "madeitpx/native/windows-x64/madeitpx.dll",
              "madeitpx/native/windows-arm64/madeitpx.dll",
              "madeitpx/native/linux-x64-gnu/libmadeitpx.so",
              "madeitpx/native/linux-arm64-gnu/libmadeitpx.so",
              "madeitpx/native/darwin-x64/libmadeitpx.dylib",
              "madeitpx/native/darwin-arm64/libmadeitpx.dylib",
          }
          with ZipFile(wheels[0]) as archive:
              missing = expected.difference(archive.namelist())
          if missing:
              raise SystemExit(f"Wheel is missing native libraries: {sorted(missing)}")
          PY
          twine check dist/*
          python -m pip install dist/*.whl
          python -c "import sys, madeitpx; assert madeitpx.__version__ == sys.argv[1], madeitpx.__version__" "$version"
      - name: Verify Rust crate
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            mkdir -p "bindings/rust/native/$rid"
            cp "native-assets/$rid/"* "bindings/rust/native/$rid/"
          done
          version="${RELEASE_TAG#v}"
          sed -i '0,/^version = .*/s//version = "'"$version"'"/' bindings/rust/Cargo.toml
          if ! grep -q "^version = \"$version\"$" bindings/rust/Cargo.toml; then
            echo "::error::Cargo.toml version was not updated"
            exit 1
          fi
          cargo update --manifest-path bindings/rust/Cargo.toml --workspace
          listing=$(cargo package --manifest-path bindings/rust/Cargo.toml --allow-dirty --list)
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            if ! grep -q "native/$rid/" <<< "$listing"; then
              echo "::error::Crate is missing native library for $rid"
              exit 1
            fi
          done
          cargo package --manifest-path bindings/rust/Cargo.toml --allow-dirty \
            --target-dir "$RUNNER_TEMP/cargo-package"
          crate=$(ls "$RUNNER_TEMP"/cargo-package/package/*.crate)
          size=$(stat -c %s "$crate")
          if [ "$size" -gt 10485760 ]; then
            echo "::error::Crate is $size bytes, above the crates.io 10 MiB limit"
            exit 1
          fi
      - name: Verify Java artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for mapping in \
            "windows-x64:madeitpx.dll" \
            "windows-arm64:madeitpx.dll" \
            "linux-x64-gnu:libmadeitpx.so" \
            "linux-arm64-gnu:libmadeitpx.so" \
            "darwin-x64:libmadeitpx.dylib" \
            "darwin-arm64:libmadeitpx.dylib"; do
            IFS=: read -r rid library <<< "$mapping"
            destination="bindings/java/src/main/resources/native/$rid"
            mkdir -p "$destination"
            cp "native-assets/$rid/$library" "$destination/"
          done
          version="${RELEASE_TAG#v}"
          mvn --batch-mode --file bindings/java/pom.xml versions:set \
            -DnewVersion="$version" \
            -DgenerateBackupPoms=false
          mvn --batch-mode --file bindings/java/pom.xml package -Dgpg.skip=true
          jar="bindings/java/target/madeitpx-$version.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::$jar not found"
            ls -la bindings/java/target
            exit 1
          fi
          listing=$(unzip -l "$jar")
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            if ! grep -q "native/$rid/" <<< "$listing"; then
              echo "::error::JAR is missing native library for $rid"
              echo "--- contents of $jar ---"
              echo "$listing"
              exit 1
            fi
          done

  verify-secrets:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets are set
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GPG_KEYID: ${{ secrets.GPG_KEYID || vars.GPG_KEYID }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          missing=0
          for name in MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE GPG_KEYID \
                      MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD CARGO_REGISTRY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set or empty"
              missing=1
            fi
          done
          exit "$missing"
      - name: Verify GPG key matches GPG_KEYID and can sign
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GPG_KEYID: ${{ secrets.GPG_KEYID || vars.GPG_KEYID }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT

          if ! printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import 2>"$RUNNER_TEMP/gpg-import.log"; then
            cat "$RUNNER_TEMP/gpg-import.log"
            echo "::error::MAVEN_GPG_PRIVATE_KEY could not be imported (expected an ASCII-armored private key)"
            exit 1
          fi
          gpg --batch --list-secret-keys --with-colons --fingerprint > "$RUNNER_TEMP/gpg-keys.txt"

          fpr=$(python3 - "$GPG_KEYID" "$RUNNER_TEMP/gpg-keys.txt" <<'PY'
          import sys
          import time

          want = sys.argv[1].replace(" ", "").upper()
          if want.startswith("0X"):
              want = want[2:]
          if len(want) < 8 or any(c not in "0123456789ABCDEF" for c in want):
              raise SystemExit(f"::error::GPG_KEYID is not a valid hex key id or fingerprint (got {len(want)} chars)")

          entries = []
          pending = None
          primary_fpr = None
          for line in open(sys.argv[2], encoding="utf-8").read().splitlines():
              f = line.split(":")
              if f[0] in ("sec", "ssb"):
                  pending = {"kind": f[0], "validity": f[1], "expires": f[6]}
              elif f[0] == "fpr" and pending is not None:
                  if pending["kind"] == "sec":
                      primary_fpr = f[9]
                  pending["fpr"] = f[9]
                  pending["primary"] = primary_fpr
                  entries.append(pending)
                  pending = None

          if not entries:
              raise SystemExit("::error::No secret key found in MAVEN_GPG_PRIVATE_KEY")

          now = time.time()

          def check(entry, label):
              if entry["validity"] == "r":
                  raise SystemExit(f"::error::{label} {entry['fpr'][-16:]} is revoked")
              if entry["validity"] == "e" or (entry["expires"] and int(entry["expires"]) < now):
                  raise SystemExit(f"::error::{label} {entry['fpr'][-16:]} is expired")
              if entry["expires"] and int(entry["expires"]) < now + 30 * 86400:
                  days = int((int(entry["expires"]) - now) // 86400)
                  print(f"::warning::{label} {entry['fpr'][-16:]} expires in {days} days", file=sys.stderr)

          matches = [e for e in entries if e["fpr"].endswith(want)]
          if not matches:
              found = ", ".join(f"{e['kind']}:{e['fpr'][-16:]}" for e in entries)
              raise SystemExit(f"::error::GPG_KEYID {want} does not match any key in MAVEN_GPG_PRIVATE_KEY (found: {found})")

          match = matches[0]
          primary = next(e for e in entries if e["kind"] == "sec" and e["fpr"] == match["primary"])
          check(primary, "Primary key")
          if match is not primary:
              check(match, "Subkey")
          print(f"GPG_KEYID matches {'primary key' if match is primary else 'subkey'} {match['fpr'][-16:]}", file=sys.stderr)
          print(primary["fpr"])
          PY
          )

          echo "madeitpx release preflight" > "$RUNNER_TEMP/gpg-payload.txt"
          if ! gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                --local-user "$fpr" --armor --detach-sign \
                --output "$RUNNER_TEMP/gpg-payload.asc" "$RUNNER_TEMP/gpg-payload.txt" 3<<<"$MAVEN_GPG_PASSPHRASE"; then
            echo "::error::Test signing failed: wrong MAVEN_GPG_PASSPHRASE or the key cannot sign"
            exit 1
          fi
          gpg --batch --verify "$RUNNER_TEMP/gpg-payload.asc" "$RUNNER_TEMP/gpg-payload.txt"
          echo "Test signature OK"

          found_on_keyserver=0
          for url in \
            "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$fpr" \
            "https://keys.openpgp.org/vks/v1/by-fingerprint/$fpr"; do
            if curl -fsS --retry 3 --max-time 20 -o /dev/null "$url"; then
              found_on_keyserver=1
              echo "Public key found: ${url%%\?*}"
            fi
          done
          if [ "$found_on_keyserver" -eq 0 ]; then
            echo "::warning::Public key $fpr was not found on keyserver.ubuntu.com or keys.openpgp.org; Maven Central may reject the signature"
          fi

  approve:
    if: github.event_name == 'push' || inputs.publish
    needs: [prepare-notes, build-native, verify-packages, verify-secrets, package-zip, package-deb, verify-deb-distros]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: release
    steps:
      - run: echo "Release ${{ inputs.tag || github.ref_name }} approved"

  create-release:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "madeitpx $RELEASE_TAG" \
              --notes-file release-notes/release-notes.md
          fi

  package-zip:
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Create native release archives
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          native = Path("native-assets")
          output = Path("release-assets")
          output.mkdir()
          for platform_dir in sorted(native.iterdir()):
              if not platform_dir.is_dir():
                  continue
              files = list(platform_dir.iterdir())
              if len(files) != 1 or not files[0].is_file():
                  raise SystemExit(f"Unexpected native files in {platform_dir}")
              archive = output / f"madeitpx-{platform_dir.name}.zip"
              with ZipFile(archive, "w", ZIP_DEFLATED) as bundle:
                  bundle.write(files[0], files[0].name)
                  bundle.write("include/madeitpx.h", "madeitpx.h")
                  bundle.write("LICENSE", "LICENSE")
              with ZipFile(archive) as bundle:
                  if bundle.testzip() is not None:
                      raise SystemExit(f"{archive} is corrupt")
                  names = set(bundle.namelist())
              expected = {files[0].name, "madeitpx.h", "LICENSE"}
              if names != expected:
                  raise SystemExit(f"{archive} has unexpected contents: {sorted(names)}")
          if len(list(output.glob("*.zip"))) != 6:
              raise SystemExit("Expected native archives for all six supported targets")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-zip
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  package-deb:
    needs: build-native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64-gnu
            arch: amd64
            triplet: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            rid: linux-arm64-gnu
            arch: arm64
            triplet: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/download-artifact@v4
        with:
          name: madeitpx-native-${{ matrix.rid }}
          path: native-assets
      - name: Build .deb packages
        env:
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
          TRIPLET: ${{ matrix.triplet }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          lib="native-assets/$RID/libmadeitpx.so"
          for file in "$lib" include/madeitpx.h LICENSE; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing $file"
              exit 1
            fi
          done
          maintainer="${GITHUB_REPOSITORY_OWNER} <${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com>"
          homepage="https://github.com/${GITHUB_REPOSITORY}"
          mkdir -p debs

          runtime="$RUNNER_TEMP/libmadeitpx"
          rm -rf "$runtime"
          install -d "$runtime/DEBIAN" "$runtime/usr/lib/$TRIPLET" "$runtime/usr/share/doc/libmadeitpx"
          install -m 0644 "$lib" "$runtime/usr/lib/$TRIPLET/libmadeitpx.so"
          install -m 0644 LICENSE "$runtime/usr/share/doc/libmadeitpx/copyright"
          cat > "$runtime/DEBIAN/control" <<EOF
          Package: libmadeitpx
          Version: $version
          Architecture: $ARCH
          Maintainer: $maintainer
          Section: libs
          Priority: optional
          Multi-Arch: same
          Depends: libc6 (>= 2.17)
          Installed-Size: $(du -sk "$runtime/usr" | cut -f1)
          Homepage: $homepage
          Description: madeitpx shared library
           Native shared library for madeitpx.
          EOF
          cat > "$runtime/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if [ "$1" = "configure" ]; then
            ldconfig
          fi
          exit 0
          EOF
          cat > "$runtime/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
            ldconfig
          fi
          exit 0
          EOF
          chmod 0755 "$runtime/DEBIAN/postinst" "$runtime/DEBIAN/postrm"
          dpkg-deb --root-owner-group --build "$runtime" "debs/libmadeitpx_${version}_${ARCH}.deb"

          dev="$RUNNER_TEMP/libmadeitpx-dev"
          rm -rf "$dev"
          install -d "$dev/DEBIAN" "$dev/usr/include" "$dev/usr/share/doc/libmadeitpx-dev"
          install -m 0644 include/madeitpx.h "$dev/usr/include/madeitpx.h"
          install -m 0644 LICENSE "$dev/usr/share/doc/libmadeitpx-dev/copyright"
          cat > "$dev/DEBIAN/control" <<EOF
          Package: libmadeitpx-dev
          Version: $version
          Architecture: $ARCH
          Maintainer: $maintainer
          Section: libdevel
          Priority: optional
          Depends: libmadeitpx (= $version)
          Installed-Size: $(du -sk "$dev/usr" | cut -f1)
          Homepage: $homepage
          Description: madeitpx development files
           C header for the madeitpx shared library.
          EOF
          dpkg-deb --root-owner-group --build "$dev" "debs/libmadeitpx-dev_${version}_${ARCH}.deb"
      - name: Verify .deb packages install and link
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLET: ${{ matrix.triplet }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          runtime="debs/libmadeitpx_${version}_${ARCH}.deb"
          dev="debs/libmadeitpx-dev_${version}_${ARCH}.deb"
          dpkg-deb --info "$runtime"
          # Capture listings first: with pipefail, `grep -q` closing the pipe early
          # makes dpkg-deb/tar die with SIGPIPE ("tar: stdout: write error").
          runtime_contents=$(dpkg-deb --contents "$runtime")
          dev_contents=$(dpkg-deb --contents "$dev")
          echo "$runtime_contents"
          echo "$dev_contents"
          if ! grep -q "usr/lib/$TRIPLET/libmadeitpx.so$" <<< "$runtime_contents"; then
            echo "::error::$runtime is missing usr/lib/$TRIPLET/libmadeitpx.so"
            exit 1
          fi
          if ! grep -q "usr/include/madeitpx.h$" <<< "$dev_contents"; then
            echo "::error::$dev is missing usr/include/madeitpx.h"
            exit 1
          fi
          sudo dpkg -i "$runtime" "$dev"
          ldconfig -p | grep libmadeitpx
          printf '#include <madeitpx.h>\nint main(void) { return 0; }\n' \
            | gcc -x c - -Wl,--no-as-needed -lmadeitpx -o "$RUNNER_TEMP/deb-link-test"
          "$RUNNER_TEMP/deb-link-test"
          sudo dpkg -r libmadeitpx-dev libmadeitpx
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-deb-${{ matrix.arch }}
          path: debs/
          if-no-files-found: error
          retention-days: 7

  verify-deb-distros:
    needs: package-deb
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - debian:13
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets-deb-${{ matrix.platform.arch }}
          path: debs
      - name: Install and link inside ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.platform.arch }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev \
            "/debs/libmadeitpx_${VERSION}_${ARCH}.deb" \
            "/debs/libmadeitpx-dev_${VERSION}_${ARCH}.deb"
          ldconfig -p | grep libmadeitpx
          printf '#include <madeitpx.h>\nint main(void) { return 0; }\n' \
            | gcc -x c - -Wl,--no-as-needed -lmadeitpx -o /tmp/deb-link-test
          /tmp/deb-link-test
          dpkg -r libmadeitpx-dev libmadeitpx
          EOF
          docker run --rm \
            -e VERSION="${RELEASE_TAG#v}" \
            -e ARCH="$ARCH" \
            -v "$PWD/debs:/debs:ro" \
            -v "$RUNNER_TEMP/check.sh:/check.sh:ro" \
            "$IMAGE" bash /check.sh

  attach-native:
    needs: [create-release, package-zip, package-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GPG_KEYID: ${{ secrets.GPG_KEYID || vars.GPG_KEYID }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT

          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          cd release-assets
          ls -la
          sha256sum *.zip *.deb > SHA256SUMS.txt
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 3 --local-user "$GPG_KEYID" \
            --armor --detach-sign \
            --output SHA256SUMS.txt.asc SHA256SUMS.txt \
            3<<<"$MAVEN_GPG_PASSPHRASE"
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
      - name: Attach native archives and .deb packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  publish-node-platforms:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: windows-x64
            package: win32-x64
          - rid: windows-arm64
            package: win32-arm64
          - rid: linux-x64-gnu
            package: linux-x64-gnu
          - rid: linux-arm64-gnu
            package: linux-arm64-gnu
          - rid: darwin-x64
            package: darwin-x64
          - rid: darwin-arm64
            package: darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Check npm version
        run: |
          required=11.5.1
          current=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $current is older than $required (required for trusted publishing)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: madeitpx-native-${{ matrix.rid }}
          path: native-assets
      - name: Publish platform package
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          PACKAGE: ${{ matrix.package }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package_dir="bindings/node/platforms/$PACKAGE"
          library=$(find "native-assets/$RID" -maxdepth 1 -type f -print -quit)
          test -n "$library"
          cp "$library" "$package_dir/"
          cp LICENSE "$package_dir/LICENSE"
          version="${RELEASE_TAG#v}"
          node -e "const fs=require('node:fs'); const p=process.argv[1]; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.version=process.argv[2]; fs.writeFileSync(p, JSON.stringify(m, null, 2)+'\n');" "$package_dir/package.json" "$version"
          name=$(node -p "require('./$package_dir/package.json').name")
          status=0
          output=$(npm view "$name@$version" version 2>&1) || status=$?
          if [ "$status" -eq 0 ] && [ "$output" = "$version" ]; then
            echo "$name@$version already published, skipping"
          elif { [ "$status" -eq 0 ] && [ -z "$output" ]; } || grep -q "E404" <<< "$output"; then
            npm publish "./$package_dir" --access public
          else
            echo "$output"
            echo "::error::Could not check whether $name@$version is already published"
            exit 1
          fi

  publish-node:
    needs: publish-node-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Check npm version
        run: |
          required=11.5.1
          current=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $current is older than $required (required for trusted publishing)"
            exit 1
          fi
      - name: Publish Node.js package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const file = 'bindings/node/package.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          manifest.version = version;
          for (const name of Object.keys(manifest.optionalDependencies)) {
            manifest.optionalDependencies[name] = version;
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          JS
          version="${RELEASE_TAG#v}"
          name=$(node -p "require('./bindings/node/package.json').name")
          status=0
          output=$(npm view "$name@$version" version 2>&1) || status=$?
          if [ "$status" -eq 0 ] && [ "$output" = "$version" ]; then
            echo "$name@$version already published, skipping"
          elif { [ "$status" -eq 0 ] && [ -z "$output" ]; } || grep -q "E404" <<< "$output"; then
            npm publish ./bindings/node --access public
          else
            echo "$output"
            echo "::error::Could not check whether $name@$version is already published"
            exit 1
          fi

  publish-dotnet:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Pack NuGet package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          project="bindings/dotnet/src/MadeIt.PixelArt"
          for mapping in \
            "windows-x64:win-x64:madeitpx.dll" \
            "windows-arm64:win-arm64:madeitpx.dll" \
            "linux-x64-gnu:linux-x64:libmadeitpx.so" \
            "linux-arm64-gnu:linux-arm64:libmadeitpx.so" \
            "darwin-x64:osx-x64:libmadeitpx.dylib" \
            "darwin-arm64:osx-arm64:libmadeitpx.dylib"; do
            IFS=: read -r source rid library <<< "$mapping"
            destination="$project/runtimes/$rid/native"
            mkdir -p "$destination"
            cp "native-assets/$source/$library" "$destination/"
          done
          version="${RELEASE_TAG#v}"
          dotnet pack "$project/MadeIt.PixelArt.csproj" \
            --configuration Release \
            --output artifacts \
            -p:PackageVersion="$version"
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg, found ${#packages[@]}"
            exit 1
          fi
          listing=$(unzip -l "${packages[0]}")
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            if ! grep -q "runtimes/$rid/native/" <<< "$listing"; then
              echo "::error::NuGet package is missing native library for $rid"
              exit 1
            fi
          done
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: TamKungZ
      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
      - name: Attach NuGet package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.nupkg --clobber

  publish-python:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/madeitpx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Build Python distributions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            destination="bindings/python/src/madeitpx/native/$rid"
            mkdir -p "$destination"
            cp "native-assets/$rid/"* "$destination/"
          done
          version="${RELEASE_TAG#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" bindings/python/src/madeitpx/__init__.py
          if ! grep -q "^__version__ = \"$version\"$" bindings/python/src/madeitpx/__init__.py; then
            echo "::error::__version__ was not updated"
            exit 1
          fi
          python -m pip install build
          python -m build bindings/python --outdir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one Python wheel, found {len(wheels)}")
          expected = {
              "madeitpx/native/windows-x64/madeitpx.dll",
              "madeitpx/native/windows-arm64/madeitpx.dll",
              "madeitpx/native/linux-x64-gnu/libmadeitpx.so",
              "madeitpx/native/linux-arm64-gnu/libmadeitpx.so",
              "madeitpx/native/darwin-x64/libmadeitpx.dylib",
              "madeitpx/native/darwin-arm64/libmadeitpx.dylib",
          }
          with ZipFile(wheels[0]) as archive:
              missing = expected.difference(archive.namelist())
          if missing:
              raise SystemExit(f"Wheel is missing native libraries: {sorted(missing)}")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Attach Python distributions to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  publish-rust:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for rid in windows-x64 windows-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            mkdir -p "bindings/rust/native/$rid"
            cp "native-assets/$rid/"* "bindings/rust/native/$rid/"
          done
          version="${RELEASE_TAG#v}"
          sed -i '0,/^version = .*/s//version = "'"$version"'"/' bindings/rust/Cargo.toml
          if ! grep -q "^version = \"$version\"$" bindings/rust/Cargo.toml; then
            echo "::error::Cargo.toml version was not updated"
            exit 1
          fi
          cargo update --manifest-path bindings/rust/Cargo.toml --workspace
          crate=$(cargo metadata --manifest-path bindings/rust/Cargo.toml --no-deps --format-version 1 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['name'] for p in d['packages'] if p['manifest_path'].endswith('bindings/rust/Cargo.toml')))")
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -A "madeitpx-release (https://github.com/TamKungZ/madeitpx)" \
            "https://crates.io/api/v1/crates/$crate/$version" || true)
          if [ "$status" = "200" ]; then
            echo "$crate@$version already published on crates.io, skipping"
          else
            cargo publish --manifest-path bindings/rust/Cargo.toml --allow-dirty
          fi

  publish-java:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - uses: actions/download-artifact@v4
        with:
          pattern: madeitpx-native-*
          path: native-assets
          merge-multiple: true
      - name: Build Java artifact
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GPG_KEYID: ${{ secrets.GPG_KEYID || vars.GPG_KEYID }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          for mapping in \
            "windows-x64:madeitpx.dll" \
            "windows-arm64:madeitpx.dll" \
            "linux-x64-gnu:libmadeitpx.so" \
            "linux-arm64-gnu:libmadeitpx.so" \
            "darwin-x64:libmadeitpx.dylib" \
            "darwin-arm64:libmadeitpx.dylib"; do
            IFS=: read -r rid library <<< "$mapping"
            destination="bindings/java/src/main/resources/native/$rid"
            mkdir -p "$destination"
            cp "native-assets/$rid/$library" "$destination/"
          done
          version="${RELEASE_TAG#v}"
          mvn --batch-mode --file bindings/java/pom.xml versions:set \
            -DnewVersion="$version" \
            -DgenerateBackupPoms=false
          mvn --batch-mode --file bindings/java/pom.xml package -Dgpg.keyname="$GPG_KEYID"
          jar="bindings/java/target/madeitpx-$version.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::$jar not found"
            ls -la bindings/java/target
            exit 1
          fi
      - name: Attach Java JAR to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "bindings/java/target/madeitpx-${RELEASE_TAG#v}.jar" --clobber
      - name: Deploy Java artifact to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GPG_KEYID: ${{ secrets.GPG_KEYID || vars.GPG_KEYID }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          group=$(mvn --batch-mode --quiet --file bindings/java/pom.xml -Dexpression=project.groupId -DforceStdout help:evaluate)
          artifact=$(mvn --batch-mode --quiet --file bindings/java/pom.xml -Dexpression=project.artifactId -DforceStdout help:evaluate)
          pom_url="https://repo1.maven.org/maven2/${group//./\/}/$artifact/$version/$artifact-$version.pom"
          status=$(curl -s -o /dev/null -w '%{http_code}' -I --max-time 20 "$pom_url" || true)
          if [ "$status" = "200" ]; then
            echo "$group:$artifact:$version already on Maven Central, skipping deploy"
          else
            mvn --batch-mode --file bindings/java/pom.xml deploy -DskipTests -Dgpg.keyname="$GPG_KEYID"
          fi

  summary:
    if: always()
    needs:
      - validate-tag
      - prepare-notes
      - build-native
      - verify-packages
      - verify-secrets
      - package-zip
      - package-deb
      - verify-deb-distros
      - approve
      - create-release
      - attach-native
      - publish-node-platforms
      - publish-node
      - publish-dotnet
      - publish-python
      - publish-rust
      - publish-java
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write job summary
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS"])
          dry_run = os.environ["EVENT_NAME"] == "workflow_dispatch" and os.environ.get("PUBLISH") != "true"
          lines = [
              f"## Release {os.environ['RELEASE_TAG']}"
              + (" (dry run)" if dry_run else ""),
              "",
              "| Job | Result |",
              "| --- | --- |",
          ]
          for name, data in needs.items():
              lines.append(f"| {name} | {data['result']} |")
