name: ci
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1"   # จันทร์ละครั้ง
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MADEITPX_LIBRARY_PATH: ${{ github.workspace }}/zig-out/lib/libmadeitpx.so
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('bindings/java/pom.xml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust
      - run: zig build
      - run: zig build test
      - run: python3 tests/test_patterns.py
      - run: mvn --batch-mode --file bindings/java/pom.xml test
      - run: npm ci --prefix bindings/node && npm test --prefix bindings/node
      - run: python -m pip install -e bindings/python && python -m unittest discover -s bindings/python/tests
      - run: cargo test --manifest-path bindings/rust/Cargo.toml
      - run: |
          proj=bindings/dotnet/tests/MadeIt.PixelArt.SmokeTests/MadeIt.PixelArt.SmokeTests.csproj
          dotnet build $proj -c Release
          cp zig-out/lib/libmadeitpx.so bindings/dotnet/tests/MadeIt.PixelArt.SmokeTests/bin/Release/net10.0/
          dotnet run --project $proj -c Release --no-build

  cross-platform:
    if: github.event_name != 'pull_request'
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-windows
            library: zig-out/bin/madeitpx.dll
            rid: windows-x64
          - runner: macos-15
            target: aarch64-macos
            library: zig-out/lib/libmadeitpx.dylib
            rid: darwin-arm64
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
            rid: linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust
      - run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}
      - name: Stage native library
        shell: bash
        run: |
          d="bindings/python/src/madeitpx/native/${{ matrix.rid }}"
          mkdir -p "$d" && cp "${{ matrix.library }}" "$d/"
      - run: python -m pip install -e bindings/python
      - run: python -m unittest discover -s bindings/python/tests
      - run: cargo test --manifest-path bindings/rust/Cargo.toml
        env:
          MADEITPX_LIBRARY_PATH: ${{ github.workspace }}/${{ matrix.library }}
      - name: dotnet smoke test
        shell: bash
        run: |
          proj=bindings/dotnet/tests/MadeIt.PixelArt.SmokeTests/MadeIt.PixelArt.SmokeTests.csproj
          dotnet build $proj -c Release
          cp "${{ matrix.library }}" bindings/dotnet/tests/MadeIt.PixelArt.SmokeTests/bin/Release/net10.0/
          dotnet run --project $proj -c Release --no-build