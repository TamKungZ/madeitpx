name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: zig build
      - run: zig build test
      - run: python3 tests/test_patterns.py
      - run: mvn --batch-mode --file bindings/java/pom.xml test
        env:
          MADEITPX_LIBRARY_PATH: ${{ github.workspace }}/zig-out/lib/libmadeitpx.so
      - run: npm ci --prefix bindings/node
      - run: npm test --prefix bindings/node
        env:
          MADEITPX_LIBRARY_PATH: ${{ github.workspace }}/zig-out/lib/libmadeitpx.so
      - run: python -m pip install --editable bindings/python
      - run: python -m unittest discover --start-directory bindings/python/tests --verbose
        env:
          MADEITPX_LIBRARY_PATH: ${{ github.workspace }}/zig-out/lib/libmadeitpx.so

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: windows-11-arm
            target: aarch64-windows
            library: zig-out/bin/madeitpx.dll
          - runner: ubuntu-24.04
            target: x86_64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu.2.17
            library: zig-out/lib/libmadeitpx.so
          - runner: macos-15-intel
            target: x86_64-macos
            library: zig-out/lib/libmadeitpx.dylib
          - runner: macos-15
            target: aarch64-macos
            library: zig-out/lib/libmadeitpx.dylib
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}
      - name: Stage Python native library
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-windows) rid=windows-x64; library=zig-out/bin/madeitpx.dll ;;
            aarch64-windows) rid=windows-arm64; library=zig-out/bin/madeitpx.dll ;;
            x86_64-linux-gnu.2.17) rid=linux-x64-gnu; library=zig-out/lib/libmadeitpx.so ;;
            aarch64-linux-gnu.2.17) rid=linux-arm64-gnu; library=zig-out/lib/libmadeitpx.so ;;
            x86_64-macos) rid=darwin-x64; library=zig-out/lib/libmadeitpx.dylib ;;
            aarch64-macos) rid=darwin-arm64; library=zig-out/lib/libmadeitpx.dylib ;;
            *) echo "Unsupported target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          destination="bindings/python/src/madeitpx/native/$rid"
          mkdir -p "$destination"
          cp "$library" "$destination/"
      - run: python -m pip install --editable bindings/python
      - run: python -m unittest discover --start-directory bindings/python/tests --verbose
      - run: cargo test --manifest-path bindings/rust/Cargo.toml
        env:
          MADEITPX_LIBRARY_PATH: ${{ github.workspace }}/${{ matrix.library }}
      - run: dotnet build bindings/dotnet/tests/MadeIt.PixelArt.SmokeTests/MadeIt.PixelArt.SmokeTests.csproj --configuration Release
      - name: Stage native library beside smoke test
        shell: bash
        run: |
          output="bindings/dotnet/tests/MadeIt.PixelArt.SmokeTests/bin/Release/net10.0"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp zig-out/bin/madeitpx.dll "$output/"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp zig-out/lib/libmadeitpx.dylib "$output/"
          else
            cp zig-out/lib/libmadeitpx.so "$output/"
          fi
      - run: dotnet run --project bindings/dotnet/tests/MadeIt.PixelArt.SmokeTests/MadeIt.PixelArt.SmokeTests.csproj --configuration Release --no-build